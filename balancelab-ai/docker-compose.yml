# Local development dependencies for BalanceLab AI.
#
# Postgres (with pgvector, ready for later retrieval milestones) backs the
# persistence layer. Before serving traffic, apply migrations against the
# database, e.g.:
#
#   docker compose run --rm app python scripts/check_migrations.py   # or:
#   docker compose run --rm -e BALANCELAB_DATABASE_URL=... app \
#       python -m alembic upgrade head
#
# Without a BALANCELAB_DATABASE_URL the app falls back to an in-memory store.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: balancelab
      POSTGRES_PASSWORD: balancelab
      POSTGRES_DB: balancelab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancelab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      BALANCELAB_ENVIRONMENT: local
      BALANCELAB_DATABASE_URL: postgresql+psycopg://balancelab:balancelab@db:5432/balancelab
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
