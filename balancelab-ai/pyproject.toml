[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "balancelab"
version = "0.0.0"
description = "Synthetic balance-sheet forecasting and scenario copilot (deterministic core)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "BalanceLab AI maintainers" }]
keywords = ["finance", "forecasting", "deterministic", "synthetic", "explainable-ai"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # psycopg 3.3 returns the server version as bytes, which SQLAlchemy 2.0's
    # psycopg dialect cannot parse; pin to the 3.2 line until that is resolved.
    "psycopg[binary]>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/balancelab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors, pyflakes, isort, bugbear, comprehensions, pyupgrade, simplify.
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["balancelab"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["balancelab"]
warn_unreachable = true
warn_redundant_casts = true
no_implicit_reexport = true

[tool.bandit]
# Scan application source only; tests use asserts and fixtures by design.
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "network: tests that require outbound network access (opt-in, deselected by default)",
]
