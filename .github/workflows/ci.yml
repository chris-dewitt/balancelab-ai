name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Python project lives in the nested balancelab-ai/ directory.
defaults:
  run:
    working-directory: balancelab-ai

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type, test, security, evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: balancelab
          POSTGRES_PASSWORD: balancelab
          POSTGRES_DB: balancelab_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U balancelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable Postgres for the opt-in storage-contract tests. App-level
      # tests pin database_url=None, so they remain in-memory and deterministic.
      BALANCELAB_TEST_DATABASE_URL: postgresql+psycopg://balancelab:balancelab@localhost:5432/balancelab_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Static typing (mypy)
        run: mypy

      - name: Unit, contract & integration tests (pytest)
        run: pytest -q

      - name: Migration check (offline + live Postgres)
        env:
          BALANCELAB_DATABASE_URL: postgresql+psycopg://balancelab:balancelab@localhost:5432/balancelab_test
        run: python scripts/check_migrations.py

      - name: Security scan (bandit)
        run: bandit -q -c pyproject.toml -r src

      - name: Dependency audit (pip-audit)
        # Skip the local editable package (not published to PyPI); third-party
        # dependencies are still audited and a vulnerability fails the build.
        run: pip-audit --skip-editable --progress-spinner off

      - name: Evaluation smoke suite
        run: python -m evals.runner

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # working-directory defaults to balancelab-ai (top-level defaults), so
        # the build context is the current directory.
        run: docker build -t balancelab-ai:ci .
