name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Python project lives in the nested balancelab-ai/ directory.
defaults:
  run:
    working-directory: balancelab-ai

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type, test, security, evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Static typing (mypy)
        run: mypy

      - name: Unit, contract & integration tests (pytest)
        run: pytest -q

      - name: Migration check
        run: python scripts/check_migrations.py

      - name: Security scan (bandit)
        run: bandit -q -c pyproject.toml -r src

      - name: Dependency audit (pip-audit)
        # Skip the local editable package (not published to PyPI); third-party
        # dependencies are still audited and a vulnerability fails the build.
        run: pip-audit --skip-editable --progress-spinner off

      - name: Evaluation smoke suite
        run: python -m evals.runner

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # working-directory defaults to balancelab-ai (top-level defaults), so
        # the build context is the current directory.
        run: docker build -t balancelab-ai:ci .
